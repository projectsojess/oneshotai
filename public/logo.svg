<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="petalGradient" cx="50%" cy="100%" r="100%" fx="50%" fy="100%">
      <stop offset="0%" style="stop-color:#000044;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#87CEEB;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Central circle (outlined) -->
  <circle cx="50" cy="50" r="10" fill="none" stroke="#000044" stroke-width="2"/>
  
  <!-- Three perpendicular petals evenly spaced at 120 degrees -->
  <path d="M50 40 L50 10 Q35 25 50 40 Q65 25 50 10 Z" fill="none" stroke="url(#petalGradient)" stroke-width="2" />
  <path d="M50 40 L50 10 Q35 25 50 40 Q65 25 50 10 Z" fill="none" stroke="url(#petalGradient)" stroke-width="2" transform="rotate(120 50 50)" />
  <path d="M50 40 L50 10 Q35 25 50 40 Q65 25 50 10 Z" fill="none" stroke="url(#petalGradient)" stroke-width="2" transform="rotate(240 50 50)" />
</svg>